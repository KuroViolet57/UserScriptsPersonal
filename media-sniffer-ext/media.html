<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Media Vault</title>
<style>
:root{
    --bg:#0f0f17; --bg2:#181823; --bg3:#22222f; --bg4:#2b2b3a;
    --line:#2e2e3d; --line2:#3a3a4c;
    --txt:#edeef5; --muted:#8f90a6; --dim:#6b6c80;

    --blue:#5b8cff; --violet:#a855f7; --amber:#f59e0b;
    --emerald:#10b981; --danger:#f43f5e; --cyan:#22d3ee;

    --sec:var(--violet);
    --grad:linear-gradient(135deg,#a855f7 0%,#5b8cff 100%);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
    background:var(--bg);color:var(--txt);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    font-size:14px;display:flex;flex-direction:column;
    min-width:320px;width:100%;height:100%;min-height:540px;overflow:hidden;
}
button{font-family:inherit;cursor:pointer}
svg{display:block;flex:0 0 auto}

body[data-sec="tab"]{--sec:var(--violet)}
body[data-sec="all"]{--sec:var(--blue)}
body[data-sec="settings"]{--sec:var(--cyan)}

header{display:flex;align-items:center;gap:10px;padding:12px 14px;flex:0 0 auto;
    background:var(--grad);color:#fff;box-shadow:0 2px 14px rgba(168,85,247,.28)}
header .logo{width:32px;height:32px;border-radius:10px;background:rgba(255,255,255,.2);
    display:flex;align-items:center;justify-content:center}
header h1{font-size:16px;margin:0;font-weight:800;flex:1;letter-spacing:.2px}
header .icon{background:rgba(255,255,255,.16);border:none;color:#fff}
header .icon:active{background:rgba(255,255,255,.3)}
.icon{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;
    background:var(--bg3);border:1px solid var(--line);color:var(--txt)}
.icon:active{background:var(--bg4)}

nav{display:flex;background:var(--bg2);border-bottom:1px solid var(--line);flex:0 0 auto}
nav button{flex:1;background:none;border:none;color:var(--dim);padding:8px 3px 7px;
    display:flex;flex-direction:column;align-items:center;gap:3px;position:relative;
    font-size:10.5px;font-weight:700;transition:color .15s}
nav button .nl{display:flex;align-items:center;gap:4px}
nav button::after{content:"";position:absolute;left:22%;right:22%;bottom:0;height:2.5px;
    border-radius:2px 2px 0 0;background:transparent;transition:background .15s}
nav button.on::after{background:currentColor}
nav button[data-sec="tab"].on{color:var(--violet)}
nav button[data-sec="all"].on{color:var(--blue)}
nav button[data-sec="settings"].on{color:var(--cyan)}
nav em{font-style:normal;font-size:9.5px;font-weight:800;background:var(--bg4);color:var(--muted);
    border-radius:9px;padding:1px 5px;min-width:16px;text-align:center}
nav em:empty{display:none}
nav button.on em{background:var(--sec);color:#0f0f17}

#filters{padding:9px 12px;background:var(--bg2);border-bottom:1px solid var(--line);flex:0 0 auto;
    display:flex;flex-direction:column;gap:7px}
.searchwrap{display:flex;align-items:center;gap:7px;background:var(--bg3);
    border:1.5px solid var(--line);border-radius:11px;padding:0 10px}
.searchwrap:focus-within{border-color:var(--sec)}
.searchwrap svg{color:var(--dim)}
#search{flex:1;background:none;border:none;color:var(--txt);padding:9px 0;font-size:13.5px;min-width:0}
#search:focus{outline:none}
.selects{display:flex;gap:6px}
.selects select{flex:1;background:var(--bg3);border:1.5px solid var(--line);color:var(--txt);
    border-radius:9px;padding:7px 6px;font-size:11.5px;font-weight:600;min-width:0}
.selects select:focus{outline:none;border-color:var(--sec)}

#main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sec{padding:10px 11px 18px}
.hidden{display:none !important}

.row{display:flex;gap:10px;align-items:flex-start;padding:10px 11px;margin-bottom:9px;
    background:var(--bg2);border:1px solid var(--line);border-radius:12px;
    border-left:3px solid var(--sec)}
.row.sel{background:linear-gradient(90deg,rgba(168,85,247,.2),var(--bg2));
    border-left-color:var(--violet);border-color:var(--line2)}
.row input[type=checkbox]{width:19px;height:19px;flex:0 0 auto;margin-top:4px;accent-color:var(--violet)}
.av{width:30px;height:30px;border-radius:9px;flex:0 0 auto;display:flex;align-items:center;
    justify-content:center;font-size:12.5px;font-weight:800;color:#fff;text-transform:uppercase;margin-top:1px}
.row .body{min-width:0;flex:1}
.row .t{font-size:12.5px;font-weight:700;word-break:break-all;line-height:1.35}
.row .meta{font-size:10px;color:var(--dim);margin-top:4px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.row .meta .size{color:var(--emerald);font-weight:800;font-size:10.5px}
.badge{font-size:9px;border-radius:5px;padding:1.5px 6px;font-weight:800;text-transform:uppercase;
    letter-spacing:.4px;background:var(--bg4);color:var(--muted)}
.badge.video{background:rgba(91,140,255,.2);color:#9ab8ff}
.badge.audio{background:rgba(16,185,129,.18);color:#5fd3ab}
.badge.stream{background:rgba(245,158,11,.18);color:#f5c163}
.badge.blob{background:rgba(168,85,247,.2);color:#cf9df7}
.badge.seg{background:rgba(34,211,238,.15);color:#7fdff0}
.row .acts{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
.ab{border:none;border-radius:8px;padding:7px 9px;font-size:10.5px;font-weight:700;cursor:pointer;
    background:var(--bg3);color:var(--txt);border:1px solid var(--line2);
    display:inline-flex;align-items:center;gap:4px}
.ab.g{background:linear-gradient(135deg,#10b981,#059669);border-color:transparent;color:#fff}
.ab.p{background:linear-gradient(135deg,#5b8cff,#7c6cff);border-color:transparent;color:#fff}

.tabhead{display:flex;align-items:center;gap:7px;margin:6px 0 8px;color:var(--blue);font-size:11px;
    font-weight:800;letter-spacing:.4px}
.tabhead .rule{flex:1;height:1px;background:linear-gradient(90deg,currentColor,transparent);opacity:.35}
.tabhead .tt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:70%}

.btn{background:var(--bg3);border:1px solid var(--line2);color:var(--txt);border-radius:10px;
    padding:9px 12px;font-size:12.5px;font-weight:700;display:inline-flex;align-items:center;
    gap:6px;justify-content:center}
.btn:active{transform:scale(.96)}
.btn.p{background:linear-gradient(135deg,#5b8cff,#7c6cff);border-color:transparent;color:#fff}
.btn.g{background:linear-gradient(135deg,#10b981,#059669);border-color:transparent;color:#fff}
.btn.d{background:rgba(244,63,94,.14);border-color:rgba(244,63,94,.4);color:#ffb3c0}

footer{flex:0 0 auto;background:var(--bg2);border-top:1px solid var(--line);padding:9px 10px;
    box-shadow:0 -3px 14px rgba(0,0,0,.35)}
footer .selinfo{font-size:11.5px;color:var(--muted);margin-bottom:8px;display:flex;align-items:center;gap:6px}
footer .selinfo b{color:var(--violet);font-size:13px}
footer .btns{display:flex;gap:6px;overflow-x:auto}
footer .btns .btn{white-space:nowrap;flex:0 0 auto}

.empty{color:var(--muted);text-align:center;padding:34px 16px;line-height:1.65;font-size:13px}
.empty .eico{width:56px;height:56px;border-radius:18px;margin:0 auto 12px;display:flex;
    align-items:center;justify-content:center;background:var(--bg3);color:var(--sec)}
.empty b{color:var(--txt)}

.field{margin-bottom:15px}
.field label{display:block;font-size:13px;font-weight:700;margin-bottom:5px}
.field .h{display:block;font-size:11px;color:var(--muted);margin-top:3px;line-height:1.5;font-weight:500}
.field input[type=number],.field input[type=text],.field select{width:100%;background:var(--bg3);
    border:1.5px solid var(--line);color:var(--txt);border-radius:10px;padding:10px;font-size:13.5px}
.field input:focus,.field select:focus{outline:none;border-color:var(--sec)}
.field.inline{display:flex;align-items:center;gap:11px}
.field.inline label{flex:1;margin:0}
.field.inline input[type=checkbox]{width:21px;height:21px;accent-color:var(--sec);flex:0 0 auto}
.field.inline input[type=number]{width:88px;flex:0 0 auto}
.field.inline select{width:150px;flex:0 0 auto}
hr{border:none;border-top:1px solid var(--line);margin:18px 0}

#toast{position:fixed;left:50%;bottom:78px;transform:translateX(-50%) translateY(8px);
    background:var(--bg4);color:#fff;padding:10px 16px;border-radius:22px;font-size:12.5px;
    font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.55);border:1px solid var(--line2);
    max-width:88%;text-align:center;opacity:0;pointer-events:none;
    transition:opacity .2s,transform .2s;z-index:50}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* Small popup viewports (mobile toolbar popups give odd sizes/scales) */
@media (max-width:380px){
    header{padding:10px 11px}
    .sec{padding:8px 8px 14px}
    nav button{min-width:0;font-size:10px}
}
@media (max-height:480px){
    header{padding:8px 11px}
    #searchbar,#filters{padding-top:6px;padding-bottom:6px}
}

/* ------------------------------- boot -------------------------------
   Static placeholder shown until the main script renders; the hint fades
   in after 5 s (CSS only, so it works even when JS never arrives). */
.boot{display:flex;flex-direction:column;align-items:center;gap:12px;padding:38px 12px;color:var(--muted);font-size:13px;overflow-wrap:anywhere;text-align:center}
.boot .spin{width:22px;height:22px;border:3px solid var(--line2);border-top-color:var(--sec);border-radius:50%;animation:spin 1s linear infinite}
.boot-hint{opacity:0;animation:bootHint 0s 5s forwards;text-align:center;max-width:280px;line-height:1.45;color:var(--dim);font-size:12px}
@keyframes bootHint{to{opacity:1}}
.bootfail{background:rgba(244,63,94,.16);border-bottom:1px solid rgba(244,63,94,.45);color:#ffb3c0;padding:10px 14px;
    font-size:12.5px;line-height:1.4;display:flex;align-items:center;gap:10px;flex:0 0 auto}
.bootfail button{background:#f43f5e;color:#fff;border:none;border-radius:9px;padding:7px 12px;font-weight:700;flex:0 0 auto;font-family:inherit}
@keyframes spin{to{transform:rotate(360deg)}}
pre.diag{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px;
    margin-top:9px;font-size:10.5px;line-height:1.55;white-space:pre-wrap;word-break:break-word;
    max-height:260px;overflow:auto;color:var(--muted)}
/* modal (tap-to-open link when the page can't launch an app) */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.68);display:flex;align-items:center;justify-content:center;padding:18px;z-index:60;backdrop-filter:blur(3px)}
.modal .mp{background:var(--bg2,var(--bg3));border:1px solid var(--line2);border-radius:16px;width:100%;max-width:340px;padding:17px;box-shadow:0 16px 50px rgba(0,0,0,.6)}
.modal h3{margin:0 0 13px;font-size:15.5px}
.modal .mb{display:flex;flex-direction:column;gap:10px}
.modal .h{font-size:12px;color:var(--muted);line-height:1.45}
a.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
</style>
<script src="popup-size.js"></script>
</head>
<body data-sec="tab">

<header>
    <span class="logo" data-ico="clap"></span>
    <h1>Media Vault</h1>
    <button class="icon" id="expand" data-ico="maximize" title="Open in a full tab"></button>
    <button class="icon" id="refresh" data-ico="refresh" title="Refresh"></button>
</header>

<nav id="nav">
    <button class="on" data-sec="tab" data-ico="film"><span class="ni"></span><span class="nl">This tab <em id="c-tab"></em></span></button>
    <button data-sec="all" data-ico="layers"><span class="ni"></span><span class="nl">All tabs <em id="c-all"></em></span></button>
    <button data-sec="settings" data-ico="sliders"><span class="ni"></span><span class="nl">Setup</span></button>
</nav>

<div id="filters">
    <div class="searchwrap">
        <span data-ico="search"></span>
        <input id="search" type="search" placeholder="Search name or URL…">
    </div>
    <div class="selects">
        <select id="f-type">
            <option value="all">All types</option>
            <option value="video">Video</option>
            <option value="audio">Audio</option>
            <option value="stream">Streams</option>
        </select>
        <select id="f-ext"><option value="all">All formats</option></select>
        <select id="f-size">
            <option value="0">Any size</option>
            <option value="1048576">&gt; 1 MB</option>
            <option value="5242880">&gt; 5 MB</option>
            <option value="20971520">&gt; 20 MB</option>
            <option value="104857600">&gt; 100 MB</option>
        </select>
    </div>
</div>

<main id="main">
    <section id="sec-tab" class="sec"><div class="boot"><div class="spin"></div>Loading…<div class="boot-hint">Still loading — the browser is slow reading the extension’s files. Close and reopen, or tap ⟳ above.</div></div></section>
    <section id="sec-all" class="sec hidden"></section>
    <section id="sec-settings" class="sec hidden"></section>
</main>

<footer id="actions" class="hidden">
    <div class="selinfo"><span data-ico="check"></span><b id="selcount">0</b> selected</div>
    <div class="btns">
        <button class="btn g" data-act="download" data-ico="download">Download</button>
        <button class="btn" data-act="copy" data-ico="copy">Copy URLs</button>
        <button class="btn d" data-act="remove" data-ico="trash">Remove</button>
    </div>
</footer>

<div id="toast"></div>

<script src="media.js"></script>
</body>
</html>
